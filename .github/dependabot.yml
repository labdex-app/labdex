# Dependency updates as pull requests (they run the full CI). Weekly, grouped so a week's
# small updates arrive as one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    groups: {actions: {patterns: ["*"]}}
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly, day: monday}
    groups:
      # packages that only work at matching major versions come together, majors included
      # (vite 8 needs @vitejs/plugin-vue 6, vue-router 5 needs vite 7+, @eslint/js 10 needs eslint 10)
      vite: {patterns: [vite, "@vitejs/*", vue-router]}
      eslint: {patterns: [eslint, "@eslint/*", eslint-plugin-vue, vue-eslint-parser, globals]}
      npm-minor: {update-types: [minor, patch]}
  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: weekly, day: monday}
    groups:
      python-minor: {update-types: [minor, patch]}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly, day: monday}
  # the official plugins in plugins/ (for the tests): a new commit on a plugin repository's main branch
  - package-ecosystem: gitsubmodule
    directory: /
    schedule: {interval: daily}
    groups: {plugins: {patterns: ["*"]}}
