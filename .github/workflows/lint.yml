name: Lint

# On every push: the quick checks (a minute or so). Tests run on pull requests (CI).
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Python (ruff, and every file compiles)
        run: |
          pip install ruff
          ruff check backend/labdex backend/tools backend/tests
          python -m compileall -q backend/labdex backend/tools
      - name: UI (eslint)
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run lint
      - name: Workflows and YAML parse
        run: |
          pip install pyyaml
          python - <<'PY'
          import glob, yaml
          for f in glob.glob(".github/workflows/*.yml") + ["examples/homelab.yaml", "mkdocs.yml"]:
              yaml.safe_load(open(f)) if not f.endswith("mkdocs.yml") else yaml.load(open(f), Loader=yaml.BaseLoader)
          print("ok")
          PY

  go:
    name: Go agent
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: gofmt, vet, tests
        working-directory: agent
        run: |
          test -z "$(gofmt -l . | tee /dev/stderr)"
          go vet ./...
          go test -race ./...
      - name: Builds for amd64 and arm64
        working-directory: agent
        run: |
          for arch in amd64 arm64; do CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -o /dev/null ./cmd/labdex-agent; done
