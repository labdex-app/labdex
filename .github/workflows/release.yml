name: Release

# Publish a GitHub release tagged with the version in the code (v1.23.0, or v1.23.0-1 for
# a hotfix; web UI, or `gh release create v1.23.0 --target main --notes ""`). This builds:
#   ghcr.io/<owner>/labdex:1.23.0, :1.23, :1 and :latest for amd64 and arm64, signed with
#   cosign (keyless, this workflow's identity) with an SPDX SBOM attached as an attestation;
#   on the release: the source archive (with the plugins), the Python wheel and sdist, their
#   SBOM, CHANGELOG.md and a cosign bundle for each file. The description gets this version's
#   CHANGELOG.md section, below anything you wrote.
on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  # each architecture builds on a runner of its own kind (no emulation), pushed by digest only
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive  # the shipped plugins live in their own repositories
      - name: Point labdex at this owner's official Marketplace (labdex-plugins)
        run: echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/labdex-plugins/index.json" > backend/labdex/keys/official/index.url
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: ANSIBLE=1
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/labdex,push-by-digest=true,name-canonical=true,push=true
          # layers come from the last release's build of this architecture (kept as :buildcache-<arch>),
          # so a release only rebuilds what changed; the GitHub Actions cache is a second source
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/labdex:buildcache-${{ matrix.arch }}
            type=gha,scope=${{ matrix.arch }}
          cache-to: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/labdex:buildcache-${{ matrix.arch }},mode=max
            type=gha,scope=${{ matrix.arch }},mode=max
      - run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  # one multi-arch image under the version's tags, then signed with its SBOM
  image:
    runs-on: ubuntu-24.04
    needs: build
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # labdex versions are MAJOR.MINOR.SUB(-N): a "-N" hotfix comes after its release
      # (SemVer would call it a pre-release and skip the floating tags), so the tags are ours
      - id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import importlib.util, os
          spec = importlib.util.spec_from_file_location("v", "backend/labdex/versioning.py")
          v = importlib.util.module_from_spec(spec); spec.loader.exec_module(v)
          import re
          raw = os.environ["GITHUB_REF_NAME"]
          code = open("backend/labdex/__init__.py").read()
          have = re.search(r'__version__ = "([^"]+)"', code).group(1)
          if raw != f"v{have}":
              raise SystemExit(f"::error::the release's tag is {raw!r}, but the code on that commit is labdex {have}: "
                               f"tag it v{have} (or bump the version first, backend/tools/bump.py)")
          print("tags=" + " ".join(v.docker_tags(have)))
          PY
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - id: build
        name: Join the architectures under the version's tags
        env:
          REPO: ghcr.io/${{ github.repository_owner }}/labdex
          TAGS: ${{ steps.version.outputs.tags }}
        run: |
          args=""; for t in $TAGS; do args="$args -t $REPO:$t"; done
          docker buildx imagetools create $args $(cd digests && printf "$REPO@sha256:%s " *)
          first=$(echo $TAGS | cut -d' ' -f1)
          echo "digest=$(docker buildx imagetools inspect "$REPO:$first" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')" >> "$GITHUB_OUTPUT"
      - name: SBOM of the image
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/labdex@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: labdex-image.spdx.json
          upload-release-assets: false
      - name: Sign the image and attach the SBOM
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/labdex@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson --predicate labdex-image.spdx.json "$IMAGE"
      - uses: actions/upload-artifact@v7
        with:
          name: image-sbom
          path: labdex-image.spdx.json

  files:
    runs-on: ubuntu-24.04
    needs: image
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive  # the shipped plugins live in their own repositories
      - name: Point labdex at this owner's official Marketplace (labdex-plugins)
        run: |
          owner="${GITHUB_REPOSITORY_OWNER}"; repo="${GITHUB_REPOSITORY#*/}"
          echo "https://${owner}.github.io/labdex-plugins/index.json" > backend/labdex/keys/official/index.url
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: sigstore/cosign-installer@v3
      - name: Build the UI, the wheel and the archives
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd frontend && npm ci && npm run build)
          pip install build
          (cd backend && python -m build --outdir ../dist)
          # the source with the shipped plugins (git archive alone leaves submodules out)
          git ls-files --recurse-submodules -z | tar --null -czf "dist/labdex-${version}-source.tar.gz" --transform "s,^,labdex-${version}/," -T -
          cp CHANGELOG.md dist/CHANGELOG.md
      - name: SBOM of the Python package
        uses: anchore/sbom-action@v0
        with:
          path: backend
          format: spdx-json
          output-file: dist/labdex-python.spdx.json
          upload-release-assets: false
      - uses: actions/download-artifact@v8
        with:
          name: image-sbom
          path: dist
      - name: Sign every file
        run: |
          cd dist
          for f in *; do cosign sign-blob --yes --bundle "$f.bundle" "$f" > /dev/null; done
          sha256sum * > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.bundle SHA256SUMS > /dev/null
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ github.event.release.body }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          # the description: what you wrote, then this version's CHANGELOG.md section (once)
          python3 - <<'PY'
          import os, re
          v = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          m = re.search(rf"^## {re.escape(v)}\s*\n(.*?)(?=^## |\Z)", open("CHANGELOG.md").read(), re.M | re.S)
          section = m.group(1).strip() if m else ""
          body = os.environ.get("BODY", "").strip()
          parts = [body] if body else []
          if section and section not in body:
              parts.append(f"## Changes in {v}\n\n{section}" if body else section)
          open("notes.md", "w").write("\n\n".join(parts) or "See CHANGELOG.md")
          PY
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
