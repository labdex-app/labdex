name: CI

# The full run (tests on SQLite and PostgreSQL, browser tests, performance budget, the
# image, the docs) on pull requests, and by hand. Every push gets the quick Lint workflow.
#
# Only what a change can affect runs: the jobs by the files a pull request touches, and the
# backend tests by pytest-testmon (it knows which tests ran which code, from the PR's last run;
# the first run of a pull request, a migration or a dependency change runs them all).
# Run it by hand (Actions › CI › Run workflow) for everything.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      full: {description: "Every job and every test", type: boolean, default: true}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      docs: ${{ steps.f.outputs.docs }}
      image: ${{ steps.f.outputs.image }}
      everything: ${{ steps.f.outputs.everything }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.base_ref }}
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: |
          if [ "$FULL" = "true" ] || [ -z "$BASE" ]; then files="*"; else files="$(git diff --name-only "origin/$BASE...HEAD")"; fi
          echo "$files" | sed 's/^/  /'
          has() { [ "$files" = "*" ] || echo "$files" | grep -qE "$1"; }
          everything=false; has '^backend/(pyproject.toml|labdex/migrations/)|^\.github/workflows/ci.yml' && everything=true
          [ "$files" = "*" ] && everything=true
          { has '^backend/|^examples/|^\.gitmodules' && echo backend=true || echo backend=false
            has '^frontend/|^backend/labdex/(api|static)/' && echo frontend=true || echo frontend=false
            has '^docs/|^mkdocs.yml|^CHANGELOG.md' && echo docs=true || echo docs=false
            has '^Dockerfile|^\.dockerignore|^backend/pyproject.toml|^frontend/package' && echo image=true || echo image=false
            echo everything=$everything; } | tee -a "$GITHUB_OUTPUT"

  backend:
    name: Tests (${{ matrix.db }})
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.everything == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: labdex
          POSTGRES_PASSWORD: labdex
          POSTGRES_DB: labdex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U labdex" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LABDEX_TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://labdex:labdex@127.0.0.1:5432/labdex_test' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive  # the shipped plugins live in their own repositories
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        working-directory: backend
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends nmap snmpd  # snmpd: the SNMPv3 client is checked against net-snmp
          pip install -e ".[server,postgres,test]" ruff pytest-testmon==2.1.4
      - name: Lint
        working-directory: backend
        run: ruff check labdex tools tests
      # which test ran which code, from this pull request's last run
      - uses: actions/cache@v4
        with:
          path: backend/.testmondata
          key: testmon-${{ matrix.db }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: testmon-${{ matrix.db }}-${{ github.head_ref || github.ref_name }}-
      - name: Tests
        working-directory: backend
        env:
          EVERYTHING: ${{ needs.changes.outputs.everything }}
        run: |
          if [ "$EVERYTHING" = "true" ] || [ ! -f .testmondata ]; then rm -f .testmondata; pytest -q --testmon-noselect
          else pytest -q --testmon; fi

  frontend-e2e-perf:
    name: UI build, browser tests, performance budget
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.image == 'true' || needs.changes.outputs.everything == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive  # the shipped plugins live in their own repositories
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Build the UI
        working-directory: frontend
        run: npm ci && npm run lint && npm run build
      - name: Install
        working-directory: backend
        run: |
          pip install -e ".[server,test]" playwright
          python -m playwright install --with-deps chromium
      - name: Browser tests
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.everything == 'true'
        working-directory: backend
        env:
          LABDEX_E2E: "1"
        run: pytest -q tests/e2e
      - name: Performance budget (1000 hosts)
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.everything == 'true'
        working-directory: backend
        env:
          LABDEX_PERF: "1"
        run: pytest -q -s tests/test_perf.py
      - name: Docker image builds
        if: needs.changes.outputs.image == 'true' || needs.changes.outputs.everything == 'true'
        run: docker build -t labdex:ci .

  docs:
    name: Docs build
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.everything == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive  # the shipped plugins live in their own repositories
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt && mkdocs build --strict
