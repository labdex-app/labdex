name: CI

# The full run (tests on SQLite and PostgreSQL, browser tests, performance budget, the
# image, the docs) on pull requests, and by hand. Every push gets the quick Lint workflow.
#
# PostgreSQL: SQLite always runs; PostgreSQL only where it can differ, i.e. a change to database
# code (models, migrations, queries, the driver), a pull request into a release branch, a run
# by hand, and every Monday on main.
#
# Only what a change can affect runs (.github/ci-changes.py decides): the jobs by what a pull
# request changes (a version bump alone changes nothing), and the backend tests by
# pytest-testmon (which tests ran which code, from the last run of this branch or main).
# Dependencies, migrations, the plugins and CI itself run everything; so does a run by hand
# (Actions › CI › Run workflow) and the Monday run on main. Lint: its own workflow, every push.
on:
  pull_request:
  schedule:
    - cron: "37 2 * * 1"  # Mondays: everything on main, PostgreSQL included
  workflow_dispatch:  # by hand: everything

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      full: ${{ steps.f.outputs.full }}
      dbs: ${{ steps.f.outputs.dbs }}
      e2e: ${{ steps.f.outputs.e2e }}
      perf: ${{ steps.f.outputs.perf }}
      docs: ${{ steps.f.outputs.docs }}
      image: ${{ steps.f.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        env:
          BASE: ${{ github.base_ref }}
          FULL: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
        run: python3 .github/ci-changes.py "$BASE" | tee -a "$GITHUB_OUTPUT"

  backend:
    name: Tests (${{ matrix.db }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        db: ${{ fromJSON(needs.changes.outputs.dbs) }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: labdex
          POSTGRES_PASSWORD: labdex
          POSTGRES_DB: labdex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U labdex" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LABDEX_TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://labdex:labdex@127.0.0.1:5432/labdex_test' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive  # the official plugins (plugins/, their own repositories)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        working-directory: backend
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends nmap snmpd  # snmpd: the SNMPv3 client is checked against net-snmp
          pip install -e ".[server,postgres,uptimekuma,test]" pytest-testmon==2.1.4
      # which test ran which code, from this pull request's last run
      - uses: actions/cache@v6
        with:
          path: backend/.testmondata
          key: testmon-${{ matrix.db }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          # this branch's last run; else main's (the Monday run); else the newest of any branch:
          # testmon compares every file with what it recorded, so an older record only means more tests
          restore-keys: |
            testmon-${{ matrix.db }}-${{ github.head_ref || github.ref_name }}-
            testmon-${{ matrix.db }}-main-
            testmon-${{ matrix.db }}-
      - name: Tests
        working-directory: backend
        env:
          FULL: ${{ needs.changes.outputs.full }}
        run: |
          if [ "$FULL" = "true" ] || [ ! -f .testmondata ]; then rm -f .testmondata; pytest -q --testmon-noselect
          else pytest -q --testmon; fi

  frontend-e2e-perf:
    name: UI build, browser tests, performance budget
    needs: changes
    if: needs.changes.outputs.e2e == 'true' || needs.changes.outputs.perf == 'true' || needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive  # the official plugins (plugins/, their own repositories)
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Build the UI
        working-directory: frontend
        run: npm ci && npm run build  # eslint: the Lint workflow
      - name: Install
        working-directory: backend
        run: |
          pip install -e ".[server,uptimekuma,test]" playwright
          python -m playwright install --with-deps chromium
      - name: Browser tests
        if: needs.changes.outputs.e2e == 'true'
        working-directory: backend
        env:
          LABDEX_E2E: "1"
        run: pytest -q tests/e2e
      - name: Performance budget (1000 hosts)
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        env:
          LABDEX_PERF: "1"
        run: pytest -q -s tests/test_perf.py
      - name: Docker image builds
        if: needs.changes.outputs.image == 'true'
        run: docker build -t labdex:ci .

  docs:
    name: Docs build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive  # the official plugins (plugins/, their own repositories)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt && mkdocs build --strict

  # The one check branch protection requires: jobs a change doesn't need are skipped and
  # never report, so this waits for all of them and fails if any of them failed.
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, backend, frontend-e2e-perf, docs]
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
