name: Docs

# The docs (MkDocs Material) per version, with mike, on the gh-pages branch:
#   https://<owner>.github.io/<repo>/dev/      main, on every push that touches the docs
#   https://<owner>.github.io/<repo>/<X.Y>/    each release (and "latest", the default)
# Pages serves the gh-pages branch (Settings › Pages › Deploy from a branch: gh-pages).
# The official plugin Marketplace is its own repository (labdex-plugins).
on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "CHANGELOG.md", ".github/workflows/docs.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write  # mike commits to gh-pages

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # mike needs the gh-pages branch
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - name: Check they build
        run: mkdocs build --strict
      - name: Publish this version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true
          if [ "$EVENT" = "release" ]; then
            v="${TAG#v}"; minor="$(echo "$v" | cut -d. -f1,2)"   # 1.24.0-1 → 1.24: a hotfix updates its version's docs
            if [ "$PRERELEASE" = "true" ]; then mike deploy --push "$minor"
            else mike deploy --push --update-aliases "$minor" latest && mike set-default --push latest; fi
          else
            mike deploy --push dev
            git ls-remote --exit-code origin gh-pages >/dev/null && mike list | grep -q latest || mike set-default --push dev
          fi
