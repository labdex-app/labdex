name: Docs

# Builds the docs (MkDocs Material) and publishes them to GitHub Pages:
#   https://<owner>.github.io/<repo>/
# The official plugin Marketplace is its own repository (labdex-plugins), built from the
# plugins' own repositories.
on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "CHANGELOG.md", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive  # the shipped plugins live in their own repositories
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            backend/pyproject.toml
      - name: Fill in the repository's address
        run: |
          owner="${GITHUB_REPOSITORY_OWNER}"; repo="${GITHUB_REPOSITORY#*/}"
          grep -rl "OWNER" mkdocs.yml docs | xargs -r sed -i "s#github.com/OWNER/labdex#github.com/${owner}/${repo}#g; s#OWNER#${owner}#g"
      - name: Build the docs
        run: |
          pip install -r docs/requirements.txt
          mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
