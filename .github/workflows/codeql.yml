name: CodeQL

# Static analysis of the backend (Python), the frontend (JavaScript/TypeScript) and the
# workflows themselves. Results land in the Security tab › Code scanning.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"  # Mondays: new queries against unchanged code

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
