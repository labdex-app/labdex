name: Image

# Every push to main builds the image, so main can be run and tested between releases:
#   ghcr.io/<owner>/labdex:dev          the newest commit on main (moves with every push)
#   ghcr.io/<owner>/labdex:sha-<7 hex>  that exact commit (stays)
# for amd64 and arm64, signed with cosign (keyless, this workflow's identity).
# Releases keep their own tags (version, X.Y, X, latest) from release.yml: `latest` is only ever
# the newest release, never main.
on:
  push:
    branches: [main]
  workflow_dispatch:  # by hand, from main

permissions:
  contents: read

# only the newest commit matters: a newer push cancels the build of the one before it
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # each architecture builds on a runner of its own kind (no emulation), pushed by digest only
  build:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: true
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Point labdex at this owner's official Marketplace (labdex-plugins)
        run: echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/labdex-plugins/index.json" > backend/labdex/keys/official/index.url
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: ANSIBLE=1
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/labdex,push-by-digest=true,name-canonical=true,push=true
          # reads the release's layer cache but never writes it (that stays the release's);
          # writes the GitHub Actions cache of main, which the next release reads too
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/labdex:buildcache-${{ matrix.arch }}
            type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  # one multi-arch image under :dev and :sha-<commit>, then signed
  image:
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write  # keyless cosign signature
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Join the architectures under :dev and :sha-<commit>, and sign
        env:
          REPO: ghcr.io/${{ github.repository_owner }}/labdex
        run: |
          short="sha-${GITHUB_SHA::7}"
          docker buildx imagetools create -t "$REPO:dev" -t "$REPO:$short" $(cd digests && printf "$REPO@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "$REPO:$short" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          cosign sign --yes "$REPO@$digest"
          echo "Pushed \`$REPO:dev\` and \`$REPO:$short\` ($digest)" >> "$GITHUB_STEP_SUMMARY"
