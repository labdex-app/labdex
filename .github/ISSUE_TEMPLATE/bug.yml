name: Bug
description: Something doesn't work as it should.
labels: ["type:bug", "needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to ...\n2. Click ...\n3. See ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: From the footer or `--version`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets, real hostnames and personal data first.
      render: text
