name: Feature
description: Something new or a change to how it works.
labels: ["type:feature", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change. Rough is fine.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we can check it works, as a checklist.
      placeholder: "- [ ] ..."
