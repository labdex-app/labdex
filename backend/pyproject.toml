[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "labdex"
version = "1.24.1"
description = "Small homelab inventory with zones, naming rules, IPAM, RBAC, change history, discovery and integration plugins"
license = { text = "AGPL-3.0-only" }  # with a plugin exception, see NOTICE
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0",
  "Flask-SQLAlchemy>=3.1",
  "SQLAlchemy>=2.0",
  "PyYAML>=6.0",
  "cryptography>=42",
  "requests>=2.31",
  "alembic>=1.13",
  "packaging>=23",
]

[project.optional-dependencies]
server = ["gunicorn>=22"]
postgres = ["psycopg[binary]>=3.1"]
uptimekuma = ["python-socketio[client]>=5.11"]
test = ["pytest>=8"]

[project.scripts]
labdex = "labdex.cli:main"

[tool.setuptools.packages.find]
include = ["labdex*"]

[tool.setuptools.package-data]
labdex = ["static/**/*", "builtin_plugins/**/*", "migrations/**/*", "keys/**/*", "CHANGELOG.md", "demo_lab.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["core_plugins_only: start with only the plugins a new labdex installs"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
# pyflakes, pycodestyle errors and warnings, bugbear, pyupgrade, comprehensions, misc; long lines are fine here
select = ["F", "E", "W", "B", "UP", "C4", "PIE", "RUF100"]
ignore = ["E501", "E701", "E702", "E731", "E741", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E", "W", "B", "UP", "C4", "PIE"]
"labdex/migrations/**" = ["UP"]
