id: tailscale
name: Tailscale / Headscale
kind: integration
tags: [vpn, discovery, status]
version: "1.0"
labdex: ">=1.3,<2"
provides: [discovery]
description: "Devices of a tailnet into Discovery (their 100.x and fd7a:… addresses), so they can be assigned to hosts, e.g. in a network of your remote-access area; known devices report online or offline as host status."
settings:
  - {key: flavor, label: Coordination server, type: select, default: tailscale, options: [tailscale, headscale]}
  - {key: url, label: Server URL, type: string, placeholder: "https://headscale.example.net", help: "Headscale's URL; for Tailscale leave empty (api.tailscale.com)"}
  - {key: tailnet, label: Tailnet, type: string, default: "-", help: "Tailscale only: '-' = the API key's tailnet"}
  - {key: api_key, label: API key, type: secret, required: true, help: "Tailscale: an API access token (devices:core:read). Headscale: headscale apikeys create"}
  - {key: offline, label: An offline device is, type: select, default: unknown, options: [unknown, down], help: "Laptops and phones go offline all the time; 'down' sends host.down"}
actions:
  - {id: test, label: Check connection, mode: run}
  - {id: poll, label: Read devices, mode: run, schedulable: true, schedule_default: 10}
widgets:
  - {id: devices, label: Tailnet, where: dashboard}
  - {id: host, label: Tailnet device, where: host}
