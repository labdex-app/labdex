id: exports
name: File exports
kind: module
tags: [files]
version: "1.1"
labdex: ">=1.3,<2"
description: Download generated files (OPNsense alias import, DNS zone, Ansible inventory, DHCP reservations, inventory YAML). Nothing is sent anywhere.
settings:
  - {key: vault_password, label: Ansible Vault password, type: secret, help: "Secrets in feature and host variables ({$secret: name}) become !vault values in the Ansible inventory; without a password they stay references"}
  - {key: vault_id, label: Vault id, type: string, help: "Optional, e.g. labdex (written as $ANSIBLE_VAULT;1.2;AES256;labdex)"}
actions:
  - {id: opnsense_json, label: OPNsense aliases (JSON import), mode: export}
  - {id: dns_zone, label: DNS records (zone file), mode: export}
  - {id: dns_json, label: DNS records (JSON), mode: export}
  - {id: ansible_inventory, label: Ansible inventory (YAML), mode: export}
  - {id: dhcp_csv, label: DHCP reservations (CSV), mode: export}
  - {id: inventory_yaml, label: Inventory (YAML), mode: export}
