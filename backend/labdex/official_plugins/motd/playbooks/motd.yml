- name: labdex login banner and prompt
  hosts: all
  gather_facts: false
  become: "{{ labdex_settings.become | default(true) | bool }}"
  tasks:
    - name: Login banner
      ansible.builtin.copy:
        dest: "{{ labdex_settings.motd_path | default('/etc/motd') }}"
        content: "{{ labdex_motd }}"
        mode: "0644"

    - name: Zone-coloured prompt
      ansible.builtin.copy:
        dest: "{{ labdex_settings.prompt_path | default('/etc/profile.d/labdex-prompt.sh') }}"
        content: |
          # managed by labdex
          [ -n "$PS1" ] && PS1='{{ labdex_ps1 }}'
        mode: "0644"
