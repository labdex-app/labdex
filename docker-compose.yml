services:
  labdex:
    build:
      context: .
      args:
        ANSIBLE: "1"            # include ansible-core for Ansible plugins (motd, your own playbooks)
    image: labdex:latest
    container_name: labdex
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # put your reverse proxy / SSO in front
    environment:
      # First start only: creates this administrator if there are no users yet.
      # Remove both lines afterwards, or leave them out and use the setup page.
      LABDEX_ADMIN_USER: admin
      LABDEX_ADMIN_PASSWORD: "change-me-please"
      LABDEX_COOKIE_SECURE: "true"                # served over HTTPS by your proxy
      # LABDEX_SECRET_KEY: ...                    # default: generated into /data/secret.key
      # Database: SQLite in /data by default. For PostgreSQL, start with
      #   docker compose --profile postgres up -d
      # and set (move an existing SQLite instance first with: labdex db copy --to <url>):
      # LABDEX_DB: postgresql://labdex:change-me-too@postgres/labdex
      # Single sign-on through a trusted proxy (Authelia, authentik, oauth2-proxy):
      # LABDEX_SSO_HEADER: Remote-User
      # LABDEX_SSO_GROUPS_HEADER: Remote-Groups
      # LABDEX_SSO_AUTOCREATE: "true"
      # LABDEX_TRUSTED_PROXIES: 172.18.0.1
    volumes:
      - ./data:/data              # database, secret.key, plugins/
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Optional: run jobs (Ansible, scans, syncs) in their own process. Set LABDEX_WORKER: external
  # on the labdex service above as well, then: docker compose up -d
  # worker:
  #   image: labdex:latest
  #   container_name: labdex-worker
  #   restart: unless-stopped
  #   command: ["labdex", "worker"]
  #   environment:
  #     LABDEX_WORKER: external
  #     # LABDEX_DB: same as the labdex service
  #   volumes:
  #     - ./data:/data
  #   read_only: true
  #   tmpfs:
  #     - /tmp
  #   cap_drop: [ALL]
  #   security_opt:
  #     - no-new-privileges:true

  # Optional PostgreSQL (docker compose --profile postgres up -d). SQLite is fine for most homelabs.
  postgres:
    profiles: [postgres]
    image: postgres:17-alpine
    container_name: labdex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: labdex
      POSTGRES_PASSWORD: change-me-too
      POSTGRES_DB: labdex
    volumes:
      - ./pgdata:/var/lib/postgresql/data   # kept apart from labdex's /data
